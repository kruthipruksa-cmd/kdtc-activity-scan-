<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="referrer" content="no-referrer">
<title>KDTC เครื่องสแกนรายวิชา</title>
<style>
:root{font-family:system-ui,"Noto Sans Thai",sans-serif;color:#18304c;background:#f4f7fb}*{box-sizing:border-box}body{margin:0}main{max-width:650px;margin:auto;padding:14px}.top{background:linear-gradient(140deg,#11284b,#245183);border-radius:16px;padding:17px;color:white;border-bottom:4px solid #d5a44a}.top h1{font-size:18px;margin:0}.top p{font-size:12px;color:#d1dce9;margin:4px 0 0}.card{margin-top:12px;background:white;border:1px solid #dce4f0;border-radius:13px;padding:15px}.info{font-size:13px;color:#6a7d95}.msg{padding:13px;border-radius:9px;margin-top:11px;background:#e9f0fa;font-size:15px;font-weight:750;text-align:center}.msg.ok{background:#e6f7ed;color:#107f52}.msg.bad{background:#fff0f0;color:#ad3840}.controls{display:flex;gap:9px;flex-wrap:wrap;margin-top:10px}button{border:0;border-radius:10px;padding:11px 15px;background:#153d6c;color:white;font:inherit;font-weight:750;cursor:pointer}.alt{background:#ecf1f7;color:#254f79}input{width:100%;padding:11px 12px;border:1px solid #cdd8e7;border-radius:9px;font:inherit}.read{margin-top:12px;max-width:440px;margin-inline:auto;overflow:hidden;border-radius:11px} .read video{max-width:100%}body.embedded main{padding:8px;max-width:100%}body.embedded .top,body.embedded footer{display:none}body.embedded .card{margin:0;border:0;padding:7px;border-radius:0}body.embedded .read{max-width:480px}body.embedded .info{margin-bottom:7px}small{display:block;color:#72839c;margin-top:12px}footer{text-align:center;color:#7588a0;margin-top:13px;font-size:11px}
.scanHeader{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.scanTally{display:inline-flex;gap:5px;align-items:baseline;font-size:12px;font-variant-numeric:tabular-nums;background:#eaf1fc;color:#1b406e;border-radius:999px;padding:5px 9px}
#back{font-size:13px;padding:8px 11px;white-space:nowrap}#back[hidden]{display:none}#backHint{font-size:12px;color:#6a7d95}
</style></head><body><main><div class="top"><h1>▣ KDTC • สแกนเช็กชื่อเข้าเรียน</h1><p>ระบบเช็กชื่อครูผู้สอน</p></div>
<div class="card"><div class="scanHeader"><button type="button" class="alt" id="back" hidden>← กลับไปหน้าหลัก</button><span class="scanTally" role="status">สแกนแล้ว <strong id="scanCount">—</strong> คน</span></div>
<p id="backHint" hidden>ปิดแท็บนี้เพื่อกลับไปยังคาบเดิม</p>
<div class="info" id="linkState">กำลังเตรียมกล้องสแกน…</div><div class="read" id="reader"></div>
<div class="controls"><button id="start">เปิดกล้องสแกน</button><button class="alt" id="stop">หยุดกล้อง</button></div>
<form id="manual"><label for="studentId" class="info">เครื่องอ่าน / กรอกรหัสนักเรียน</label><input id="studentId" inputmode="text" autocomplete="off" placeholder="รหัสนักเรียน / QR"><div class="controls"><button type="submit">เช็กชื่อ</button></div></form>
<div class="msg" id="result">พร้อมรับข้อมูลจาก QR</div>
<small>แสดงผลการเช็กชื่อทันทีผ่านระบบกลาง KDTC</small></div><footer>วิทยาลัยเทคนิคกาญจนดิษฐ์</footer>
</main>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script><script>
'use strict';
const $=id=>document.getElementById(id),nonce=new URLSearchParams(location.hash.slice(1)).get('nonce')||'';
const embedded=new URLSearchParams(location.search).get('embedded')==='1';
if(embedded)document.body.classList.add('embedded');
history.replaceState(null,'',location.pathname+location.search);
let target=null,targetOrigin='',ready=false,pending=null,reader=null,starting=false,sequence=0;
$('back').hidden=embedded||!window.opener;
function updateCount(count){
 if(Number.isInteger(count)&&count>=0)$('scanCount').textContent=String(count);
}
function allowedOrigin(origin){
 try{const u=new URL(origin);return u.protocol==='https:'&&(u.hostname==='script.google.com'||u.hostname==='script.googleusercontent.com'||u.hostname.endsWith('-script.googleusercontent.com'))}
 catch(e){return false}
}
function msg(text,good){$('result').textContent=text;$('result').className='msg '+(good===true?'ok':good===false?'bad':'')}
function post(data){if(!target||!targetOrigin)return;target.postMessage(Object.assign({nonce},data),targetOrigin)}
function handshake(){
 const receiver=window.opener||window.parent;if(!receiver||receiver===window)return;
 receiver.postMessage({kind:'KDTC_SCANNER_READY',nonce},'*');
}
window.addEventListener('message',event=>{
 if(!allowedOrigin(event.origin))return;
 if(event.source!==window.parent&&event.source!==window.opener)return;
 const d=event.data;if(!d||d.nonce!==nonce)return;
 if(target&&(event.source!==target||event.origin!==targetOrigin))return;
 if(d.kind==='KDTC_SCANNER_CONFIG'){
  target=event.source;targetOrigin=event.origin;ready=!!d.enabled;
  updateCount(d.scanCount);
  $('linkState').textContent=ready?'พร้อมสแกนเข้าเรียน':'กรุณาเปิดคาบเรียนจากหน้าหลัก';
  if(ready&&!reader&&!starting)startCamera();
  if(!ready)stopCamera();
 }
 if(!target)return;
 if(d.kind==='KDTC_SCAN_COUNT')updateCount(d.count);
 if(d.kind==='KDTC_SCAN_RESULT'){
  const r=d.result||{};
  updateCount(r.scanCount);
  if(pending===null||(d.requestId!=null&&d.requestId!==pending))return;
  pending=null;
  const say=r.ok?(r.duplicate?'สแกนซ้ำ':r.status==='PRESENT'?'ผ่านครับ':r.status==='LATE'?'สายแล้วครับ':r.status==='LEAVE'?'บันทึกลาแล้วครับ':'ขาดครับ'):(r.error||'บันทึกไม่สำเร็จ');
  msg(say,!!r.ok);
  speak(r.ok?say:'ไม่ผ่านครับ');
 }
});
function speak(text){
 try{if('speechSynthesis' in window){speechSynthesis.cancel();const utter=new SpeechSynthesisUtterance(text);utter.lang='th-TH';utter.rate=1;speechSynthesis.speak(utter)}}catch(_){}
}
function submit(raw){
 const code=String(raw||'').trim();
 if(!ready)return msg('กรุณาเปิดคาบเรียนจากหน้าหลักก่อน',false);
 if(pending!==null||!code||code.length>150)return;
 const requestId=++sequence;
 pending=requestId;
 msg('กำลังบันทึกผลเช็กชื่อ…');
 post({kind:'KDTC_STUDENT_SCAN',code,requestId});
 setTimeout(()=>{if(pending===requestId){pending=null;msg('ยังไม่ได้รับคำยืนยันจากระบบ กรุณาตรวจสอบก่อนสแกนซ้ำ',false)}},25000);
}
async function startCamera(){
 if(!ready)return msg('กรุณาเปิดคาบเรียนจากหน้าหลักก่อน',false);
 if(reader||starting)return;
 if(!window.Html5Qrcode)return msg('โหลดตัวอ่าน QR ไม่สำเร็จ ใช้เครื่องอ่านหรือกรอกรหัสแทนได้',false);
 starting=true;
 const camera=new Html5Qrcode('reader');reader=camera;
 try{
  await camera.start({facingMode:'environment'},{fps:10,qrbox:{width:220,height:220}},value=>submit(value),()=>{});
  starting=false;
  // A close request can arrive while browser camera permission is pending.
  if(!ready||reader!==camera){
   try{await camera.stop()}catch(_){}
   try{await camera.clear()}catch(_){}
   if(reader===camera)reader=null;
   return;
  }
  msg('พร้อมสแกน QR นักเรียน');
 }catch(e){
  if(reader===camera)reader=null;
  starting=false;
  try{await camera.clear()}catch(_){}
  msg('โปรดแตะ เปิดกล้องสแกน หากกล้องยังไม่ทำงาน: '+(e.message||String(e)),false);
 }
}
async function stopCamera(){
 if(!reader)return;const x=reader;reader=null;try{await x.stop()}catch(e){}try{await x.clear()}catch(e){}
}
$('back').onclick=()=>{
 ready=false;
 stopCamera();
 post({kind:'KDTC_SCANNER_BACK'});
 window.close();
 $('backHint').hidden=false;
};
window.addEventListener('pagehide',()=>{ready=false;stopCamera()});
$('start').onclick=startCamera;$('stop').onclick=stopCamera;
$('manual').onsubmit=e=>{e.preventDefault();const v=$('studentId').value;$('studentId').value='';submit(v)};
if(!/^[0-9a-f]{32}$/.test(nonce))msg('กรุณาเปิดหน้าเครื่องสแกนผ่านระบบหลัก Apps Script',false);
else handshake();
setInterval(()=>{if(nonce&&!target)handshake()},1600);
</script></body></html>
