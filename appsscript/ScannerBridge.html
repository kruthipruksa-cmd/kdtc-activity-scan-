<!doctype html><html><head><meta charset="utf-8"></head><body><p>เชื่อมต่อหน้าเครื่องสแกน KDTC</p><script>
'use strict';
const origin='https:'+String.fromCharCode(47,47)+'kruthipruksa-cmd.github.io';
const nonce=<?!= JSON.stringify(bridgeNonce) ?>;
const methods=new Set(['requestScannerDevice','getScannerRequestStatus','restoreScannerDevice','getScannerBootstrap','submitScanBatch']);
const pending=new Set();
function send(data){window.top.postMessage(Object.assign({channel:'KDTC_SCANNER_V1',nonce},data),origin)}
let readyTimer=setInterval(()=>send({type:'ready'}),1000);send({type:'ready'});
window.addEventListener('message',event=>{
 if(event.origin!==origin||event.source!==window.top)return;
 const d=event.data;if(!d||d.channel!=='KDTC_SCANNER_V1'||d.nonce!==nonce)return;
 if(d.type==='connected'){clearInterval(readyTimer);return}
 if(d.type!=='rpc'||typeof d.id!=='string'||d.id.length>100||!methods.has(d.method)||!Array.isArray(d.args)||d.args.length>4||pending.has(d.id)||pending.size>=8)return;
 if(JSON.stringify(d.args).length>100000){send({type:'result',id:d.id,error:'ข้อมูลใหญ่เกินไป'});return}
 pending.add(d.id);const done=data=>{pending.delete(d.id);send(Object.assign({type:'result',id:d.id},data))};
 google.script.run.withSuccessHandler(result=>done({result})).withFailureHandler(e=>done({error:e.message||String(e)}))[d.method](...d.args);
});
</script></body></html>
